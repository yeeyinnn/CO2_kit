; PlatformIO project configuration for LilyGO T-SIM7670G-S3-Standard
; (ESP32-S3-WROOM-1, 16MB Quad-SPI Flash, 2MB Quad-SPI PSRAM)
;
; There is no official PlatformIO board id for this exact board, so this
; config starts from the generic "esp32-s3-devkitc-1" board (same
; ESP32-S3-WROOM-1 module family) and overrides the flash size, partition
; table, and PSRAM mode to match LilyGO's documented Arduino IDE settings
; for the T-SIM7670G-S3-Standard:
;   Flash Size: 16MB (128Mb), Quad-SPI
;   Partition Scheme: 16M Flash (3MB APP / 9.9MB FATFS)
;   PSRAM: 2MB, Quad-SPI (QSPI, not Octal/OPI)
;   USB CDC On Boot: Enable
;   CPU Frequency: 240MHz

[env:t-sim7670g-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Flash / PSRAM / partitioning ---
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv   ; swap for a custom 16MB CSV if you need the 9.9MB FATFS split
board_build.arduino.memory_type = qio_qspi   ; Quad flash + Quad PSRAM (this board is QSPI, not OPI)
board_build.psram_type = qspi

; --- Serial / USB ---
; This board uses native USB (USB CDC) for the console, matching
; "USB CDC On Boot: Enable" in the Arduino IDE instructions.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
; upload_speed = 921600

; --- Libraries ---
lib_deps =
    adafruit/Adafruit BME680 Library@^2.0.5
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1